
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Analytics</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header>
        <h1>Community Real Estate Analytics</h1>
        <p>Property insights and recommendation overview</p>
    </header>

    <main>
        
<section class="comparison-section">
    <h2>Compare Properties</h2>
    <p>Select at least two properties.</p>

    <label><input type="checkbox" class="property-check" value="3"> Student Home PG</label>
    <br>
    <label><input type="checkbox" class="property-check" value="1"> Green Nest PG</label>
    <br>
    <label><input type="checkbox" class="property-check" value="5"> Campus Stay PG</label>
    <br>
    <label><input type="checkbox" class="property-check" value="2"> City Comfort PG</label>
    <br><br>

    <button id="compareBtn">Compare Selected Properties</button>
    <p id="comparisonMessage"></p>
    <div id="comparisonResult"></div>
</section>

        <section class="stats">
            <div class="card">
                <h3>Total Properties</h3>
                <p id="totalProperties">10</p>
            </div>

            <div class="card">
                <h3>Student Properties</h3>
                <p id="studentProperties">5</p>
            </div>

            <div class="card">
                <h3>Residential Properties</h3>
                <p id="residentialProperties">3</p>
            </div>

            <div class="card">
                <h3>Commercial Properties</h3>
                <p id="commercialProperties">2</p>
            </div>
        </section>

        <section class="charts">
            <div class="chart-card">
                <h2>Properties by Category</h2>
                <canvas id="categoryChart"></canvas>
            </div>

            <div class="chart-card">
                <h2>Category Distribution</h2>
                <canvas id="categoryPieChart"></canvas>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
